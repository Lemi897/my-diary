<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <!-- ============================================================
    login.html - Authentication Page
    Handles: Sign up with email+password, Sign in, password reset.
    Uses Supabase Auth. On success redirects to index.html.
    No sidebar/bottom-nav — this page is outside the app shell,
    but it now shares the same theme system as every other page.
  ============================================================ -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="My Diary - Sign in to your account" />
  <title>Sign In | My Diary</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <!-- Blocking theme loader: runs before first paint to prevent flash -->
  <script>
    (function(){
      var t = localStorage.getItem('active_theme') || '';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <style>
    /* --------------------------------------------------------
       Auth page — standalone layout, but colors come from the
       shared theme system (css/main.css + css/themes.css) so
       this page reskins along with the rest of the app.
    -------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Full-page centered layout */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at top, var(--bg-secondary) 0%, var(--bg-primary) 70%);
      position: relative;
      overflow: hidden;
      perspective: 1200px;
      transition: background 3s ease;
    }
    /* Time-of-day — a real, live clock-based shift, not decoration.
       Applies regardless of theme, unlike Neo-Tokyo's own daytime
       system which is theme-gated; this is login's own, separate,
       lightweight version so the shared applyDaytime() elsewhere
       stays untouched. */
    .auth-page[data-daytime="dawn"] { background: radial-gradient(ellipse at top, #2a1f2e 0%, #150d18 70%); }
    .auth-page[data-daytime="day"]  { background: radial-gradient(ellipse at top, #1c2333 0%, #10141f 70%); }
    .auth-page[data-daytime="dusk"] { background: radial-gradient(ellipse at top, #2e1f1a 0%, #180f0c 70%); }
    .auth-page[data-daytime="night"] { background: radial-gradient(ellipse at top, var(--bg-secondary) 0%, var(--bg-primary) 70%); }

    /* Interactive bubble background — soft blurred color fields
       that drift on their own and gently repel away from the
       cursor. Uses each theme's own accent colors, so it matches
       whichever theme is active without any extra wiring.
       .auth-card below gets explicit position+z-index because an
       absolutely-positioned layer paints above static content by
       default regardless of DOM order — learned that the hard way
       building Neo-Tokyo's ambient scene; applying it correctly
       here from the start. */
    .bubble-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .bubble-wrap { position: absolute; will-change: transform; transition: transform 0.15s ease-out; }
    .bubble { border-radius: 50%; filter: blur(45px); will-change: transform; }
    .bubble-1 { width: 380px; height: 380px; opacity: 0.7; background: radial-gradient(circle, var(--accent-1), transparent 70%); animation: bubblePulse1 4s ease-in-out infinite, bubbleDrift1 20s ease-in-out infinite; }
    .bubble-2 { width: 320px; height: 320px; opacity: 0.65; background: radial-gradient(circle, var(--accent-2), transparent 70%); animation: bubblePulse2 5s ease-in-out infinite 0.5s, bubbleDrift2 24s ease-in-out infinite; }
    .bubble-3 { width: 260px; height: 260px; opacity: 0.65; background: radial-gradient(circle, var(--accent-3), transparent 70%); animation: bubblePulse3 4.5s ease-in-out infinite 1s, bubbleDrift3 18s ease-in-out infinite; }
    .bubble-wrap-1 { left: 8%; top: 12%; }
    .bubble-wrap-2 { left: 62%; top: 48%; }
    .bubble-wrap-3 { left: 30%; top: 68%; }
    @keyframes bubblePulse1 { 0%, 100% { scale: 1; } 50% { scale: 1.12; } }
    @keyframes bubblePulse2 { 0%, 100% { scale: 1; } 50% { scale: 1.1; } }
    @keyframes bubblePulse3 { 0%, 100% { scale: 1; } 50% { scale: 1.14; } }
    @keyframes bubbleDrift1 { 0%, 100% { translate: 0 0; } 50% { translate: 50px -35px; } }
    @keyframes bubbleDrift2 { 0%, 100% { translate: 0 0; } 50% { translate: -60px 45px; } }
    @keyframes bubbleDrift3 { 0%, 100% { translate: 0 0; } 50% { translate: 35px 50px; } }

    /* Auth card */
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }

    /* Cursor trail — small fading dots drifting behind the pointer,
       in the theme's own accent colors. */
    .cursor-trail-dot {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: trailFade 0.7s ease-out forwards;
    }
    @keyframes trailFade {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.3); }
    }

    /* Logo */
    .auth-logo {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .auth-logo span { color: var(--accent-1); }

    .auth-tagline {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* Tab switcher: Sign In / Sign Up */
    .auth-tabs {
      display: flex;
      background-color: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 1.75rem;
      gap: 4px;
      position: relative;
    }
    .auth-tab-pill {
      position: absolute;
      top: 4px; left: 4px;
      width: calc(50% - 6px);
      height: calc(100% - 8px);
      background-color: var(--accent-1);
      border-radius: 6px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .auth-tab {
      flex: 1;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-main);
      transition: color 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .auth-tab.active {
      color: #fff;
    }

    /* Form elements */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: var(--font-main);
      transition: var(--transition);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-1);
      background-color: var(--bg-card);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-1) 25%, transparent);
    }

    /* Password toggle button */
    .toggle-pw {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      font-family: var(--font-main);
    }

    .toggle-pw:hover { color: var(--text-secondary); }

    /* Submit button */
    .btn-auth {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-main);
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-auth:hover { opacity: 0.9; }
    .btn-auth:active { transform: scale(0.97); }
    .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Error / success message */
    .auth-message {
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      display: none;
    }

    .auth-message.error {
      display: block;
      background-color: color-mix(in srgb, var(--danger) 15%, transparent);
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    }

    .auth-message.success {
      display: block;
      background-color: color-mix(in srgb, var(--success) 12%, transparent);
      color: var(--success);
      border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
    }

    /* Forgot password link */
    .auth-footer-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.83rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .auth-footer-link:hover { color: var(--accent-1); }

    /* Name field (signup only) */
    #nameGroup { display: none; }
  </style>
</head>

<body>
  <div class="auth-page">
    <div class="bubble-bg" id="bubbleBg" aria-hidden="true">
      <div class="bubble-wrap bubble-wrap-1" id="bubbleWrap1"><div class="bubble bubble-1"></div></div>
      <div class="bubble-wrap bubble-wrap-2" id="bubbleWrap2"><div class="bubble bubble-2"></div></div>
      <div class="bubble-wrap bubble-wrap-3" id="bubbleWrap3"><div class="bubble bubble-3"></div></div>
    </div>
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">My<span>Diary</span></div>
      <div class="auth-tagline">Your personal life tracker</div>

      <!-- Sign In / Sign Up tabs -->
      <div class="auth-tabs">
        <div class="auth-tab-pill" id="authTabPill"></div>
        <button class="auth-tab active" id="tabSignin"  onclick="switchTab('signin')">Sign In</button>
        <button class="auth-tab"        id="tabSignup"  onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Message area -->
      <div class="auth-message" id="authMessage"></div>

      <!-- Name field (signup only) -->
      <div class="form-group" id="nameGroup">
        <label class="form-label" for="nameInput">Your Name</label>
        <div class="input-wrapper">
          <i class="ri-user-3-line input-icon"></i>
          <input class="form-input" type="text" id="nameInput" placeholder="e.g. Maestro" autocomplete="name" />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="emailInput">Email Address</label>
        <div class="input-wrapper">
          <i class="ri-mail-line input-icon"></i>
          <input class="form-input" type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <div class="input-wrapper">
          <i class="ri-lock-line input-icon"></i>
          <input class="form-input" type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
          <button class="toggle-pw" type="button" onclick="togglePassword()" id="togglePwBtn">
            <i class="ri-eye-line" id="pwEyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-auth" id="authBtn" onclick="handleAuth()">
        <i class="ri-login-circle-line"></i>
        <span id="authBtnText">Sign In</span>
      </button>

      <!-- Forgot password -->
      <span class="auth-footer-link" id="forgotLink" onclick="handleForgotPassword()">
        Forgot your password?
      </span>

    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://teppimpaunucbwingqac.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_a1ozZ46y55IgOYSlU7RrZg_fuK4G2Qb';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ----------------------------------------------------------
    // INTERACTIVE BUBBLES — runs immediately, independent of auth.
    // Bubbles drift on their own via CSS; this layer adds a gentle
    // repulsion away from the cursor on top of that drift. Each
    // bubble's own animated transform lives on the INNER .bubble
    // div, while this JS only ever touches the OUTER .bubble-wrap's
    // transform — two separate elements, so the two transforms
    // compose instead of one overwriting the other.
    // ----------------------------------------------------------
    (function initBubbles() {
      const bubbleEls = document.querySelectorAll('.bubble-wrap');
      if (!bubbleEls.length) return;

      // Each bubble follows the pointer at a different strength and
      // with its own offset, so they trail together as a loose group
      // rather than all stacking exactly on the cursor.
      const wraps = [
        { el: bubbleEls[0], strength: 0.35, offsetX: 0,   offsetY: 0,   x: 0, y: 0 },
        { el: bubbleEls[1], strength: 0.22, offsetX: 60,  offsetY: -40, x: 0, y: 0 },
        { el: bubbleEls[2], strength: 0.28, offsetX: -50, offsetY: 50,  x: 0, y: 0 },
      ];

      const card = document.querySelector('.auth-card');
      let tiltX = 0, tiltY = 0;

      let pointerX = null, pointerY = null;
      let hasPointer = false;

      function setPointer(x, y) { pointerX = x; pointerY = y; hasPointer = true; }

      document.addEventListener('mousemove', (e) => setPointer(e.clientX, e.clientY));
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      function loop() {
        if (hasPointer) {
          wraps.forEach(w => {
            const targetX = (pointerX - window.innerWidth / 2) * w.strength + w.offsetX;
            const targetY = (pointerY - window.innerHeight / 2) * w.strength + w.offsetY;
            w.x += (targetX - w.x) * 0.08;
            w.y += (targetY - w.y) * 0.08;
            w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
          });

          if (card) {
            const rect = card.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = (pointerX - cx) / (window.innerWidth / 2);
            const dy = (pointerY - cy) / (window.innerHeight / 2);
            const targetRotY = dx * 6;
            const targetRotX = -dy * 6;
            tiltX += (targetRotX - tiltX) * 0.1;
            tiltY += (targetRotY - tiltY) * 0.1;
            card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
          }
        }
        requestAnimationFrame(loop);
      }
      loop();

      // Cursor trail — small fading dots, throttled so it doesn't
      // spawn one per pixel of movement.
      const trailColors = ['var(--accent-1)', 'var(--accent-2)', 'var(--accent-3)'];
      let lastTrailTime = 0;
      document.addEventListener('mousemove', (e) => {
        const now = Date.now();
        if (now - lastTrailTime < 60) return;
        lastTrailTime = now;
        const dot = document.createElement('div');
        dot.className = 'cursor-trail-dot';
        dot.style.left = (e.clientX - 3) + 'px';
        dot.style.top = (e.clientY - 3) + 'px';
        dot.style.background = trailColors[Math.floor(Math.random() * trailColors.length)];
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 700);
      });
    })();

    // ----------------------------------------------------------
    // TIME-OF-DAY — a lightweight, login-specific version. Kept
    // separate from the shared applyDaytime() in utils.js on
    // purpose: that one is gated to only run for Neo-Tokyo, and
    // changing that shared behavior to suit this one page could
    // have knock-on effects everywhere else it's used.
    // ----------------------------------------------------------
    (function applyLoginDaytime() {
      const hour = new Date().getHours();
      let daytime;
      if (hour >= 5 && hour < 7) daytime = 'dawn';
      else if (hour >= 7 && hour < 17) daytime = 'day';
      else if (hour >= 17 && hour < 19) daytime = 'dusk';
      else daytime = 'night';
      document.querySelector('.auth-page')?.setAttribute('data-daytime', daytime);
    })();


    // ----------------------------------------------------------
    // If already signed in, skip straight to dashboard
    // ----------------------------------------------------------
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.replace('index.html');

    // ----------------------------------------------------------
    // TAB SWITCHING
    // ----------------------------------------------------------
    let currentTab = 'signin';

    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById('tabSignin').classList.toggle('active', tab === 'signin');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('authTabPill').style.transform = tab === 'signup' ? 'translateX(calc(100% + 4px))' : 'translateX(0)';
      document.getElementById('nameGroup').style.display = tab === 'signup' ? 'flex' : 'none';
      document.getElementById('authBtnText').textContent = tab === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authBtn').querySelector('i').className =
        tab === 'signin' ? 'ri-login-circle-line' : 'ri-user-add-line';
      document.getElementById('forgotLink').style.display = tab === 'signin' ? 'block' : 'none';
      clearMessage();
    };

    // ----------------------------------------------------------
    // PASSWORD VISIBILITY TOGGLE
    // ----------------------------------------------------------
    window.togglePassword = function() {
      const input = document.getElementById('passwordInput');
      const icon  = document.getElementById('pwEyeIcon');
      const show  = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'ri-eye-off-line' : 'ri-eye-line';
    };

    // ----------------------------------------------------------
    // MESSAGE HELPERS
    // ----------------------------------------------------------
    function showMessage(text, type = 'error') {
      const el = document.getElementById('authMessage');
      el.textContent = text;
      el.className = 'auth-message ' + type;
    }

    function clearMessage() {
      const el = document.getElementById('authMessage');
      el.className = 'auth-message';
      el.textContent = '';
    }

    // ----------------------------------------------------------
    // MAIN AUTH HANDLER
    // ----------------------------------------------------------
    window.handleAuth = async function() {
      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const name     = document.getElementById('nameInput').value.trim();
      const btn      = document.getElementById('authBtn');

      clearMessage();

      if (!email || !password) {
        showMessage('Please enter your email and password.');
        return;
      }

      if (currentTab === 'signup' && password.length < 6) {
        showMessage('Password must be at least 6 characters.');
        return;
      }

      btn.disabled = true;
      document.getElementById('authBtnText').textContent = 'Please wait...';

      if (currentTab === 'signin') {
        // ---- SIGN IN ----
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(error.message);
          btn.disabled = false;
          document.getElementById('authBtnText').textContent = 'Sign In';
        } else {
          window.location.replace('index.html');
        }

      } else {
        // ---- SIGN UP ----
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          showMessage(error.message);
          btn.disabled = false;
          document.getElementById('authBtnText').textContent = 'Create Account';
          return;
        }

        // Create profile row for the new user
        if (data.user) {
          await supabase.from('profiles').upsert({
            id: data.user.id,
            name: name || email.split('@')[0]
          });
        }

        showMessage(
          'Account created! Check your email to confirm, then sign in.',
          'success'
        );
        switchTab('signin');
        btn.disabled = false;
      }
    };

    // ----------------------------------------------------------
    // FORGOT PASSWORD
    // ----------------------------------------------------------
    window.handleForgotPassword = async function() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) {
        showMessage('Enter your email address above first.');
        return;
      }
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/index.html'
      });
      if (error) {
        showMessage(error.message);
      } else {
        showMessage('Password reset email sent — check your inbox.', 'success');
      }
    };

    // ----------------------------------------------------------
    // Allow Enter key to submit
    // ----------------------------------------------------------
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleAuth();
    });
  </script>
</body>
</html>
